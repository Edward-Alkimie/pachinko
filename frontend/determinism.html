<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pachinko determinism test</title>
    <style>
      body { background: #0b0f17; color: #e6e9ef; font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
      main { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }
      h1 { font-size: 1.3rem; margin: 0; }
      p { margin: 0; color: #8a94a6; }
      label { display: flex; gap: 8px; align-items: center; }
      input { width: 90px; background: #18202e; color: inherit; border: 1px solid #2c3850; border-radius: 6px; padding: 6px; }
      button { background: #b8892b; color: #0b0f17; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; }
      button:disabled { opacity: 0.5; }
      pre { background: #18202e; border-radius: 8px; padding: 12px; white-space: pre-wrap; word-break: break-all; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Determinism test</h1>
      <p>Runs the fixed seed corpus in this browser. The digest must equal <code>npm run determinism</code> in Node.</p>
      <label>Rounds <input id="rounds" type="number" min="1" value="1000" /> <button id="run">Run</button></label>
      <pre id="out">Not started.</pre>
    </main>
    <script type="module" src="/src/determinism.ts"></script>
  </body>
</html>
